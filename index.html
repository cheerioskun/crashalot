<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A different view of flying — Team Eyecandy</title>
    <meta name="description" content="A closer look at aviation safety, risk, and perspective. A presentation by Team Eyecandy." />
    <link id="presentation-theme" rel="stylesheet" />
  </head>
  <body>
    <header class="presentation-header">
      <a class="presentation-brand" href="#/welcome">Eyecandy <span>/ Flying</span></a>
      <div class="presentation-utilities" role="group" aria-label="Overhead controls">
        <button type="button" class="utility-button" id="playback-toggle" aria-label="Auto reveals" aria-keyshortcuts="Space" title="Auto reveals on · click or press Space to turn off" aria-pressed="true">
          <svg class="utility-icon seatbelt-icon" viewBox="0 0 32 24" aria-hidden="true">
            <path class="belt-strap" d="M2 10h8v6H2zm21 0h7v6h-7z"/>
            <rect x="10" y="7" width="8" height="12" rx="1.5"/>
            <path d="M18 9h5v8h-5m-4-6v4"/>
          </svg>
        </button>
        <button type="button" class="utility-button" id="theme-toggle" aria-label="Cabin light" title="Cabin light on · click for dark mode" aria-pressed="true">
          <svg class="utility-icon reading-light-icon" viewBox="0 0 28 24" aria-hidden="true">
            <path d="M10 3h12m-6 0v4m-3 0 6 2-3 8-8-3 5-7Z"/>
            <path class="lamp-rays" d="m7 18-2 3m5-2-1 3m-4-7-3 1"/>
          </svg>
        </button>
        <span id="presentation-theme-status" class="visually-hidden" role="status"></span>
      </div>
    </header>
    <div class="reveal" aria-label="A different view of flying presentation">
      <div class="slides"></div>
      <footer class="presentation-footer">
        <div class="story-position" data-story-position aria-live="polite"></div>
        <div class="presentation-keyboard-hint" aria-label="Use the left and right arrow keys to navigate. Space toggles auto reveals. Going back turns auto reveals off. Scroll to read longer pages.">
          <span class="navigation-hint"><span class="navigation-keys"><kbd>←</kbd><kbd>→</kbd></span><span>to navigate</span></span>
          <span class="touch-navigation-hint">Tap Next to begin</span>
          <span class="reading-hint"><svg viewBox="0 0 16 22" fill="none" aria-hidden="true"><rect x="2.5" y="1.5" width="11" height="18" rx="5.5"/><path d="M8 5v4"/></svg><span>scroll longer pages</span></span>
        </div>
        <nav aria-label="Story navigation">
          <button type="button" class="story-nav" data-story-back aria-label="Back"><span aria-hidden="true">←</span> Back</button>
          <button type="button" class="story-nav story-nav-next" data-story-next aria-label="Next"><span data-next-label>Next</span> <span aria-hidden="true">→</span></button>
        </nav>
      </footer>
    </div>
    <script type="module" src="/src/presentation.js"></script>
  </body>
</html>
