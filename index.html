<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A different view of flying — Team Eyecandy</title>
    <meta name="description" content="A closer look at aviation safety, risk, and perspective. A presentation by Team Eyecandy." />
    <link id="presentation-theme" rel="stylesheet" />
  </head>
  <body>
    <header class="presentation-header">
      <a class="presentation-brand" href="#/welcome">Eyecandy <span>/ Flying</span></a>
      <nav class="story-stages" aria-label="Story chapters"><a href="#/change-over-time" data-stage="notice">Notice</a><span aria-hidden="true">/</span><a href="#/another-perspective" data-stage="reconsider">Reconsider</a><span aria-hidden="true">/</span><a href="#/flight-phase" data-stage="inspect">Inspect</a></nav>
      <div class="presentation-utilities" aria-label="Presentation settings">
        <button type="button" class="utility-button" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="utility-button" id="playback-toggle" aria-label="Enable auto playback" title="Manual playback · switch to Auto" aria-pressed="false">
          <svg class="icon-manual" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 9-7 1-3 7-4-17Z"/></svg>
          <svg class="icon-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></svg>
        </button>
        <span id="presentation-theme-status" class="visually-hidden" role="status"></span>
      </div>
    </header>
    <div class="reveal" aria-label="A different view of flying presentation">
      <div class="slides"></div>
      <footer class="presentation-footer">
        <div class="story-position" data-story-position aria-live="polite"></div>
        <span class="presentation-keyboard-hint"><kbd>←</kbd> <kbd>→</kbd> to navigate</span>
        <nav aria-label="Story navigation">
          <button type="button" class="story-nav" data-story-back aria-label="Back"><span aria-hidden="true">←</span> Back</button>
          <button type="button" class="story-nav story-nav-next" data-story-next aria-label="Next"><span data-next-label>Next</span> <span aria-hidden="true">→</span></button>
        </nav>
      </footer>
    </div>
    <script type="module" src="/src/presentation.js"></script>
  </body>
</html>
