<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A different view of flying — Team Eyecandy</title>
    <meta name="description" content="A closer look at aviation safety, risk, and perspective. A presentation by Team Eyecandy." />
    <link id="presentation-theme" rel="stylesheet" />
  </head>
  <body>
    <header class="presentation-header">
      <a class="presentation-brand" href="#/welcome">Eyecandy <span>/ Flying</span></a>
      <nav class="story-stages" aria-label="Story chapters"><a href="#/change-over-time" data-stage="notice">Notice</a><span aria-hidden="true">/</span><a href="#/another-perspective" data-stage="reconsider">Reconsider</a><span aria-hidden="true">/</span><a href="#/flight-phase" data-stage="inspect">Inspect</a></nav>
      <details class="appearance-menu"><summary>Appearance</summary><div class="presentation-theme-picker">
        <label for="presentation-theme-select">Theme</label>
        <select id="presentation-theme-select" class="form-select form-select-sm" aria-label="Presentation theme">
          <option value="default">Bootstrap Default</option>
          <option value="sandstone">Sandstone</option>
          <option value="darkly">Darkly</option>
        </select>
        <span id="presentation-theme-status" class="visually-hidden" role="status"></span>
      </div></details>
    </header>
    <div class="reveal" aria-label="A different view of flying presentation">
      <div class="slides"></div>
      <footer class="presentation-footer">
        <span class="presentation-keyboard-hint">Use the arrow keys to explore</span>
        <nav aria-label="Presentation navigation">
          <button type="button" class="btn btn-sm presentation-nav navigate-prev" aria-label="Previous page">← <span>Previous</span></button>
          <button type="button" class="btn btn-sm presentation-nav navigate-next" aria-label="Next page"><span>Next</span> →</button>
        </nav>
      </footer>
    </div>
    <script type="module" src="/src/presentation.js"></script>
  </body>
</html>
